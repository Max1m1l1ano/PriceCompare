<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceCompare - Comparateur de Prix Épiceries Québec</title>
    <meta name="description" content="Comparez les prix des épiceries à Québec - IGA, Metro, Super C">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .search-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
        }
        
        .search-box input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .search-box input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        .refresh-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .refresh-btn:hover {
            background: #229954;
            transform: translateY(-2px);
        }
        
        .store-filters {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .store-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        
        .store-checkbox:hover {
            background: #e9ecef;
        }
        
        .store-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3498db;
        }
        
        .results {
            padding: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        
        .loading i {
            font-size: 3rem;
            color: #3498db;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .product-grid {
            display: grid;
            gap: 20px;
        }
        
        .product-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .product-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .product-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .product-category {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .price-comparison {
            padding: 20px;
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f1f3f4;
        }
        
        .price-row:last-child {
            border-bottom: none;
        }
        
        .store-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .store-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 0.8rem;
        }
        
        .store-logo.metro { background: #e74c3c; }
        .store-logo.superc { background: #f39c12; }
        .store-logo.iga { background: #27ae60; }
        
        .price-info {
            text-align: right;
        }
        
        .price {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .price.best-price {
            color: #27ae60;
            font-size: 1.4rem;
        }
        
        .unit-price {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 2px;
        }
        
        .best-price-badge {
            background: #27ae60;
            color: white;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .no-results i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .stats {
            background: #f8f9fa;
            padding: 20px 30px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #3498db;
            display: block;
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            .store-filters {
                justify-content: center;
            }
            
            .stats {
                justify-content: center;
            }
            
            .stat-item {
                flex: 1;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shopping-cart"></i> PriceCompare</h1>
            <p>Trouvez les meilleurs prix d'épicerie à Québec</p>
        </div>
        
        <div class="controls">
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Rechercher un produit... (ex: lait, pain, pommes)">
                </div>
                <button class="refresh-btn" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i>
                    Actualiser
                </button>
            </div>
            
            <div class="store-filters">
                <label class="store-checkbox">
                    <input type="checkbox" id="metro" checked onchange="filterResults()">
                    <span>Metro</span>
                </label>
                <label class="store-checkbox">
                    <input type="checkbox" id="superc" checked onchange="filterResults()">
                    <span>Super C</span>
                </label>
                <label class="store-checkbox">
                    <input type="checkbox" id="iga" checked onchange="filterResults()">
                    <span>IGA</span>
                </label>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <i class="fas fa-spinner"></i>
            <p>Chargement des prix...</p>
        </div>
        
        <div class="results" id="results">
            <div class="product-grid" id="productGrid">
                <!-- Products will be loaded here -->
            </div>
            
            <div class="no-results" id="noResults" style="display: none;">
                <i class="fas fa-search"></i>
                <h3>Aucun résultat trouvé</h3>
                <p>Essayez un autre terme de recherche ou vérifiez les filtres.</p>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-value" id="totalProducts">-</span>
                <span class="stat-label">Produits</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="avgSavings">-</span>
                <span class="stat-label">Économies moy.</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="lastUpdate">-</span>
                <span class="stat-label">Dernière MAJ</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
